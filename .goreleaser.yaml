version: 2

project_name: rxds

before:
  hooks:
    - go mod download
    - go mod verify

builds:
  - main: ./cmd/rxds
    binary: rxds
    id: rxds
    env:
      - CGO_ENABLED=0
    goos: [windows, linux, darwin, freebsd]
    goarch: [amd64, arm64, ppc64le]
    ignore:
      - goos: windows
        goarch: arm64
      # ppc64le is a linux-only Go target
      - goos: windows
        goarch: ppc64le
      - goos: darwin
        goarch: ppc64le
      - goos: freebsd
        goarch: ppc64le
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: rxds
    ids: [rxds]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ if eq .Os "darwin" }}macOS{{ else }}{{ .Os }}{{ end }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'
  algorithm: sha256

snapshot:
  version_template: '{{ incpatch .Version }}-dev'

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - typo
      - Merge pull request
      - Merge branch
  groups:
    - title: 'fixed'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'new'
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 'performance'
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: other
      order: 999

release:
  github:
    owner: x-stp
    name: rxds
  prerelease: auto
  draft: false
  name_template: '{{ .Tag }}'
  header: |
    ## rx/dialstreamer {{ .Tag }}
    
    dial. stream. harvest.
  footer: |
    ## install
    
    ```bash
    go install github.com/x-stp/rxds/cmd/rxds@{{ .Tag }}
    ```
    
    Or download the binary for your platform from the assets below.

    ### docker
    ```bash
    docker pull ghcr.io/x-stp/rxds:{{ .Tag }}
    ```

    **docs**: https://github.com/x-stp/rxds#readme

dockers:
  - image_templates:
      - 'ghcr.io/x-stp/{{ .ProjectName }}:{{ .Tag }}-amd64'
      - 'ghcr.io/x-stp/{{ .ProjectName }}:v{{ .Major }}.{{ .Minor }}-amd64'
      - 'ghcr.io/x-stp/{{ .ProjectName }}:v{{ .Major }}-amd64'
      - 'ghcr.io/x-stp/{{ .ProjectName }}:latest-amd64'
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - '--pull'
      - '--platform=linux/amd64'
      - '--label=org.opencontainers.image.created={{ .Date }}'
      - '--label=org.opencontainers.image.title={{ .ProjectName }}'
      - '--label=org.opencontainers.image.revision={{ .FullCommit }}'
      - '--label=org.opencontainers.image.version={{ .Version }}'
      - '--label=org.opencontainers.image.source=https://github.com/x-stp/rxds'
      - '--label=org.opencontainers.image.licenses=MPL-2.0'
    goarch: amd64
    goos: linux

  - image_templates:
      - 'ghcr.io/x-stp/{{ .ProjectName }}:{{ .Tag }}-arm64'
      - 'ghcr.io/x-stp/{{ .ProjectName }}:v{{ .Major }}.{{ .Minor }}-arm64'
      - 'ghcr.io/x-stp/{{ .ProjectName }}:v{{ .Major }}-arm64'
      - 'ghcr.io/x-stp/{{ .ProjectName }}:latest-arm64'
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - '--pull'
      - '--platform=linux/arm64'
      - '--label=org.opencontainers.image.created={{ .Date }}'
      - '--label=org.opencontainers.image.title={{ .ProjectName }}'
      - '--label=org.opencontainers.image.revision={{ .FullCommit }}'
      - '--label=org.opencontainers.image.version={{ .Version }}'
      - '--label=org.opencontainers.image.source=https://github.com/x-stp/rxds'
      - '--label=org.opencontainers.image.licenses=MPL-2.0'
    goarch: arm64
    goos: linux

docker_manifests:
  - name_template: 'ghcr.io/x-stp/{{ .ProjectName }}:{{ .Tag }}'
    image_templates:
      - 'ghcr.io/x-stp/{{ .ProjectName }}:{{ .Tag }}-amd64'
      - 'ghcr.io/x-stp/{{ .ProjectName }}:{{ .Tag }}-arm64'

  - name_template: 'ghcr.io/x-stp/{{ .ProjectName }}:v{{ .Major }}.{{ .Minor }}'
    image_templates:
      - 'ghcr.io/x-stp/{{ .ProjectName }}:v{{ .Major }}.{{ .Minor }}-amd64'
      - 'ghcr.io/x-stp/{{ .ProjectName }}:v{{ .Major }}.{{ .Minor }}-arm64'

  - name_template: 'ghcr.io/x-stp/{{ .ProjectName }}:v{{ .Major }}'
    image_templates:
      - 'ghcr.io/x-stp/{{ .ProjectName }}:v{{ .Major }}-amd64'
      - 'ghcr.io/x-stp/{{ .ProjectName }}:v{{ .Major }}-arm64'

  - name_template: 'ghcr.io/x-stp/{{ .ProjectName }}:latest'
    image_templates:
      - 'ghcr.io/x-stp/{{ .ProjectName }}:latest-amd64'
      - 'ghcr.io/x-stp/{{ .ProjectName }}:latest-arm64'

homebrew_casks:
  - repository:
      owner: x-stp
      name: homebrew-rxds
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    name: rxds
    directory: Casks
    homepage: 'https://github.com/x-stp/rxds'
    description: 'rx/dialstreamer — streaming TLS certificate harvester'
    license: 'MPL-2.0'

nfpms:
  - id: rxds
    package_name: rxds
    formats:
      - deb
      - rpm
      - apk
    vendor: 'x-stp'
    homepage: 'https://github.com/x-stp/rxds'
    maintainer: 'x-stp <hello@vanderstap.info>'
    description: 'rx/dialstreamer — streaming TLS certificate harvester'
    license: 'MPL-2.0'
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/rxds/LICENSE
      - src: ./README.md
        dst: /usr/share/doc/rxds/README.md
